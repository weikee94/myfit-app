<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MyFit" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Triathlon + Strength training tracker with progressive overload" />
    <title>MyFit — Triathlon & Strength Tracker</title>
    <script>
      // Applies the stored theme before first paint so the page never flashes the wrong mode.
      (function () {
        var theme = "system";
        try {
          var stored = localStorage.getItem("myfit-theme");
          if (stored) {
            var parsed = JSON.parse(stored).state.theme;
            if (parsed === "light" || parsed === "dark") theme = parsed;
          }
        } catch (e) {}
        var dark =
          theme === "dark" ||
          (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#0a0a0a" : "#ffffff");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
